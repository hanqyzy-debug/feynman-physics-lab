<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка графики лаборатории</title><link rel="stylesheet" href="../assets/course.css?v=20261103-3d"><style>body{max-width:1000px;margin:auto;padding:24px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}#result{white-space:pre-wrap}#host{border:1px solid #34516c;border-radius:14px}#host .model-controls{display:none}#host .model-layout{grid-template-columns:1fr}</style></head><body><h1 style="font-size:30px">Проверка графики</h1><div class="controls"><label>Модель <select id="select"></select></label><button id="paint">Проверить кадр</button><button id="loss">Прервать 3D</button><button id="restore">Восстановить 3D</button><label><input id="unavailable" type="checkbox">WebGL недоступен</label><button id="rebuild">Пересоздать модель</button></div><p id="result" role="status">Подготовка…</p><div id="host"></div>
<script src="../assets/math.js"></script><script src="../assets/science.js"></script><script src="../assets/content.js"></script><script src="../assets/models.js"></script><script src="../assets/extra-models.js"></script><script src="../assets/space3d.js"></script><script src="../assets/spatial-scenes.js"></script><script src="../assets/spatial-view.js"></script>
<script>
'use strict';
const host=document.getElementById('host'),select=document.getElementById('select'),result=document.getElementById('result');let sim=null,gl=null,lossExtension=null;
const realGetContext=HTMLCanvasElement.prototype.getContext;
HTMLCanvasElement.prototype.getContext=function(type,...args){if(type==='webgl'&&document.getElementById('unavailable').checked)return null;return realGetContext.call(this,type,...args);};
for(const id of SpaceScenes.ids()){const option=document.createElement('option');option.value=id;option.textContent=id+' · '+LabModels.specs[id].title;select.append(option);}
function setup(){sim?.dispose();host.innerHTML='';host.dataset.loaded='';host.dataset.spatial='';sim=LabModels.mount(select.value,host);sim.draw(1,.033);gl=host.querySelector('.spatial-canvas').getContext('webgl');lossExtension=gl?.getExtension('WEBGL_lose_context');result.textContent='Подготовлено: '+select.value;}
function inspect(){sim.draw(1,0);if(!gl||gl.isContextLost()){result.textContent='Схема работает · loaded='+host.dataset.loaded+' · spatial='+host.dataset.spatial;return;}const canvas=host.querySelector('.spatial-canvas'),pixels=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let visible=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i]>25||pixels[i+1]>35||pixels[i+2]>45)visible++;const error=gl.getError();result.textContent=JSON.stringify({model:select.value,loaded:host.dataset.loaded,spatial:host.dataset.spatial,pixels:visible,error},null,2);result.dataset.pixels=String(visible);result.dataset.error=String(error);}
select.onchange=setup;document.getElementById('paint').onclick=inspect;document.getElementById('rebuild').onclick=setup;document.getElementById('loss').onclick=()=>lossExtension?.loseContext();document.getElementById('restore').onclick=()=>lossExtension?.restoreContext();window.addEventListener('pagehide',()=>sim?.dispose());setup();
</script></body></html>
